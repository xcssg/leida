<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUOFANG 控制台</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3242;
  --fg:#d7dee8; --dim:#7d8899; --acc:#4ea1ff; --ok:#3fb950;
  --warn:#d29922; --bad:#f85149;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
}
a{color:var(--acc);text-decoration:none}
h1,h2,h3{margin:0;font-weight:600}
input,select,button,textarea{
  font:inherit;color:var(--fg);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:6px 10px;outline:none;
}
input:focus,select:focus{border-color:var(--acc)}
button{cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
button.primary:hover{filter:brightness(1.1);color:#04101f}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---- 顶栏 ---- */
header{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;
}
.logo{font-weight:700;letter-spacing:.14em;font-size:15px}
.logo span{color:var(--acc)}
.tag{
  font-size:11px;padding:2px 8px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);
}
.tag.on{color:var(--ok);border-color:#1d4429;background:#0d2415}
.tag.off{color:var(--warn);border-color:#3d3117;background:#241d0b}
.spacer{flex:1}
.keybox{display:flex;gap:6px;align-items:center}
.keybox input{width:210px}

/* ---- 布局 ---- */
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat .k{font-size:11px;color:var(--dim);letter-spacing:.06em}
.stat .v{font-size:21px;font-weight:600;font-family:ui-monospace,monospace}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)}
.stat .v.bad{color:var(--bad)} .stat .v.acc{color:var(--acc)}

.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--dim);padding:8px 16px;border-radius:0;
}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.panel{display:none}
.panel.active{display:block}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=text]{width:240px}
.bar .n{color:var(--dim)}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.05em;background:var(--panel)}
tbody tr:hover{background:#131923}
td.acts{display:flex;gap:5px}
td.acts button{padding:2px 8px;font-size:11px}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:64vh}
.empty{padding:36px;text-align:center;color:var(--dim)}

.pill{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid}
.pill.s0{color:var(--dim);border-color:var(--line)}
.pill.s1{color:var(--ok);border-color:#1d4429;background:#0d2415}
.pill.s2{color:var(--bad);border-color:#4a1c1c;background:#2a0f0f}
.pill.sx{color:var(--warn);border-color:#3d3117;background:#241d0b}

/* ---- 弹窗 ---- */
#toast{
  position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99;
}
.toast{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:6px;padding:9px 14px;max-width:420px;box-shadow:0 6px 24px #0008;
  animation:in .18s ease-out;
}
.toast.err{border-left-color:var(--bad)}
.toast.ok{border-left-color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#genOut{
  display:none;margin-top:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:12px;
}
#genOut textarea{
  width:100%;height:150px;resize:vertical;margin-top:8px;
  font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;
}
.hint{color:var(--dim);font-size:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
</style>
</head>
<body>

<header>
  <div class="logo">ZUO<span>FANG</span></div>
  <span class="tag" id="modeTag">模式 ?</span>
  <span class="tag" id="verTag">v-</span>
  <div class="spacer"></div>
  <div class="keybox">
    <input id="adminKey" type="password" placeholder="管理密钥 X-Admin-Key">
    <button onclick="saveKey()">保存</button>
    <button onclick="refreshAll()">刷新</button>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-panel="cards">卡密</button>
    <button class="tab" data-panel="sessions">在线会话</button>
    <button class="tab" data-panel="audit">审计日志</button>
  </div>

  <!-- 卡密 -->
  <section class="panel active" id="panel-cards">
    <div class="row" style="margin-bottom:14px">
      <div>
        <label>生成数量</label>
        <input id="genCount" type="text" value="10" style="width:100%">
      </div>
      <div>
        <label>有效天数</label>
        <input id="genDays" type="text" value="30" style="width:100%">
      </div>
      <div>
        <label>批次名</label>
        <input id="genBatch" type="text" value="web" style="width:100%">
      </div>
      <div>
        <label>备注</label>
        <input id="genNote" type="text" placeholder="可留空" style="width:100%">
      </div>
      <div>
        <button class="primary" style="width:100%" onclick="generate()">生成卡密</button>
      </div>
    </div>

    <div id="genOut">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span id="genTitle" class="hint"></span>
        <span>
          <button onclick="copyGen()">复制</button>
          <button onclick="downloadGen()">下载</button>
          <button onclick="document.getElementById('genOut').style.display='none'">关闭</button>
        </span>
      </div>
      <textarea id="genText" readonly></textarea>
    </div>

    <div class="bar" style="margin-top:16px">
      <input id="q" type="text" placeholder="搜索卡密" onkeydown="if(event.key==='Enter')loadCards()">
      <select id="fStatus">
        <option value="">全部状态</option>
        <option value="0">未激活</option>
        <option value="1">生效中</option>
        <option value="2">已封禁</option>
      </select>
      <button onclick="loadCards()">查询</button>
      <span class="spacer"></span>
      <span class="n" id="cardCount"></span>
    </div>

    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>卡密</th><th>状态</th><th>时长</th><th>到期</th>
            <th>剩余</th><th>设备</th><th>批次</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="cardBody"></tbody>
      </table>
    </div>
  </section>

  <!-- 会话 -->
  <section class="panel" id="panel-sessions">
    <div class="bar">
      <span class="hint">UDP 隧道活跃会话。封禁卡密后这里的记录会立刻消失。</span>
      <span class="spacer"></span>
      <span class="n" id="sessCount"></span>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>地址</th><th>会话 ID</th><th>卡密</th><th>模式</th><th>虚拟 IP</th>
            <th>收</th><th>发</th><th>丢</th><th>RTT</th><th>存活</th><th>空闲</th>
          </tr>
        </thead>
        <tbody id="sessBody"></tbody>
      </table>
    </div>
  </section>

  <!-- 审计 -->
  <section class="panel" id="panel-audit">
    <div class="bar">
      <button onclick="loadAudit()">刷新</button>
      <span class="spacer"></span>
      <span class="n" id="auditCount"></span>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr><th>时间</th><th>动作</th><th>卡密</th><th>设备</th><th>IP</th><th>详情</th></tr>
        </thead>
        <tbody id="auditBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
/* ---------------------------------------------------------------- 基础 */

var KEY = localStorage.getItem("zf_admin_key") || "";
var VERSION = "";
var genList = [];

function $(id){ return document.getElementById(id); }

function toast(msg, kind){
  var d = document.createElement("div");
  d.className = "toast" + (kind ? " " + kind : "");
  d.textContent = msg;
  $("toast").appendChild(d);
  setTimeout(function(){ d.remove(); }, 3600);
}

function saveKey(){
  KEY = $("adminKey").value.trim();
  localStorage.setItem("zf_admin_key", KEY);
  toast("密钥已保存", "ok");
  refreshAll();
}

function api(path, opts){
  opts = opts || {};
  var headers = { "X-Admin-Key": KEY };
  if(opts.body) headers["content-type"] = "application/json";
  return fetch(path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok) throw new Error(j.message || ("HTTP " + r.status));
      return j;
    });
  });
}

/* 时间格式 */
function ts(v){
  if(!v) return "-";
  var d = new Date(v * 1000);
  var p = function(n){ return n < 10 ? "0" + n : "" + n; };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function dur(sec){
  sec = Math.max(0, sec|0);
  if(sec === 0) return "-";
  var d = Math.floor(sec / 86400);
  var h = Math.floor(sec % 86400 / 3600);
  if(d > 0) return d + "天" + (h ? h + "小时" : "");
  var m = Math.floor(sec % 3600 / 60);
  if(h > 0) return h + "小时" + (m ? m + "分" : "");
  return m + "分";
}
function size(n){
  n = n|0;
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(1) + " KB";
  if(n < 1073741824) return (n/1048576).toFixed(1) + " MB";
  return (n/1073741824).toFixed(2) + " GB";
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------------------------------------------------------------- 统计 */

function loadStats(){
  return api("/admin/stats").then(function(s){
    var r = s.relay || {};
    VERSION = s.server_time ? "" : "";
    $("modeTag").textContent = "出网 " + (r.mode || "?");
    $("modeTag").className = "tag " + (r.mode === "tun" ? "on" : "off");

    var items = [
      ["卡片总数", s.cards_total, ""],
      ["未激活", s.cards_unused, ""],
      ["生效中", s.cards_active, "ok"],
      ["已封禁", s.cards_banned, s.cards_banned ? "bad" : ""],
      ["已过期", s.cards_expired, s.cards_expired ? "warn" : ""],
      ["在线 token", s.tokens_live, "acc"],
      ["隧道会话", r.sessions || 0, (r.sessions ? "ok" : "")],
      ["WS 连接", s.ws_online || 0, ""],
      ["收 / 发", size(r.rx_bytes||0) + " / " + size(r.tx_bytes||0), ""],
      ["坏包", r.bad_pkts || 0, (r.bad_pkts ? "warn" : "")],
      ["握手拒绝", r.rejected || 0, (r.rejected ? "bad" : "")],
      ["运行", dur(r.uptime || 0), ""]
    ];
    $("stats").innerHTML = items.map(function(it){
      return '<div class="stat"><div class="k">' + it[0] + '</div>'
           + '<div class="v ' + it[2] + '">' + it[1] + '</div></div>';
    }).join("");

    renderSessions(s.sessions || []);
  }).catch(function(e){
    $("stats").innerHTML = '<div class="empty">无法读取统计：' + esc(e.message) + '</div>';
  });
}

/* ---------------------------------------------------------------- 卡密 */

function statusPill(c){
  if(c.status === 2) return '<span class="pill s2">封禁</span>';
  if(!c.activated_at) return '<span class="pill s0">未激活</span>';
  if(c.expired) return '<span class="pill sx">已过期</span>';
  return '<span class="pill s1">生效中</span>';
}

function loadCards(){
  var q = $("q").value.trim();
  var st = $("fStatus").value;
  var url = "/admin/cards?limit=500";
  if(q) url += "&q=" + encodeURIComponent(q);
  if(st !== "") url += "&status=" + st;

  api(url).then(function(r){
    var list = r.cards || [];
    $("cardCount").textContent = "共 " + list.length + " 条";
    if(!list.length){
      $("cardBody").innerHTML = '<tr><td colspan="8" class="empty">没有卡密</td></tr>';
      return;
    }
    $("cardBody").innerHTML = list.map(function(c){
      var dev = (c.devices && c.devices.length) ? c.devices[0].device : "-";
      var k = esc(c.card_key);
      return "<tr>"
        + '<td class="mono">' + k + '</td>'
        + "<td>" + statusPill(c) + "</td>"
        + "<td>" + c.plan_days + " 天</td>"
        + "<td>" + (c.expires_at ? ts(c.expires_at) : "-") + "</td>"
        + "<td>" + (c.remaining_seconds ? dur(c.remaining_seconds) : "-") + "</td>"
        + '<td class="mono">' + esc(dev.length > 16 ? dev.slice(0,16) + "…" : dev) + "</td>"
        + "<td>" + esc(c.batch || "-") + "</td>"
        + '<td class="acts">'
          + '<button onclick="cardOp(\'ban\',\'' + k + '\')">封禁</button>'
          + '<button onclick="cardOp(\'unban\',\'' + k + '\')">解封</button>'
          + '<button onclick="cardOp(\'unbind\',\'' + k + '\')">解绑</button>'
          + '<button onclick="cardOp(\'reset\',\'' + k + '\')">重置</button>'
          + '<button class="danger" onclick="cardOp(\'delete\',\'' + k + '\')">删除</button>'
        + "</td></tr>";
    }).join("");
  }).catch(function(e){
    $("cardBody").innerHTML = '<tr><td colspan="8" class="empty">' + esc(e.message) + "</td></tr>";
  });
}

function cardOp(op, key){
  if(op === "delete" && !confirm("确定删除 " + key + " ？此操作不可恢复。")) return;
  if(op === "ban" && !confirm("封禁 " + key + " 会立刻踢掉在线会话，继续？")) return;

  api("/admin/cards/" + op, { method: "POST", body: { card_key: key } })
    .then(function(r){
      var msg = "已执行 " + op;
      if(r.kicked) msg += "，踢下线 " + r.kicked + " 个会话";
      toast(msg, "ok");
      loadCards(); loadStats();
    })
    .catch(function(e){ toast(e.message, "err"); });
}

function generate(){
  var n = parseInt($("genCount").value, 10) || 0;
  var d = parseInt($("genDays").value, 10) || 0;
  if(n < 1 || n > 2000) return toast("数量需在 1..2000", "err");
  if(d < 1 || d > 3650) return toast("天数需在 1..3650", "err");

  api("/admin/cards/generate", {
    method: "POST",
    body: {
      count: n, days: d,
      batch: $("genBatch").value.trim() || "web",
      note: $("genNote").value.trim() || null
    }
  }).then(function(r){
    genList = r.cards || [];
    $("genText").value = genList.join("\n");
    $("genTitle").textContent = "已生成 " + genList.length + " 张 · "
      + r.days + " 天 · 批次 " + $("genBatch").value.trim();
    $("genOut").style.display = "block";
    toast("生成成功", "ok");
    loadCards(); loadStats();
  }).catch(function(e){ toast(e.message, "err"); });
}

function copyGen(){
  var t = $("genText");
  t.select();
  try{
    document.execCommand("copy");
    toast("已复制到剪贴板", "ok");
  }catch(e){
    toast("复制失败，请手动选择", "err");
  }
}

function downloadGen(){
  var blob = new Blob([genList.join("\n")], { type: "text/plain" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "zuofang-cards-" + Date.now() + ".txt";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* ---------------------------------------------------------------- 会话 */

function renderSessions(list){
  $("sessCount").textContent = "活跃 " + list.length + " 条";
  if(!list.length){
    $("sessBody").innerHTML = '<tr><td colspan="11" class="empty">当前没有隧道会话</td></tr>';
    return;
  }
  $("sessBody").innerHTML = list.map(function(s){
    var short = String(s.session_id || "");
    return "<tr>"
      + '<td class="mono">' + esc(s.addr) + "</td>"
      + '<td class="mono">' + esc(short.slice(0, 12)) + "</td>"
      + '<td class="mono">' + esc(s.card_key) + "</td>"
      + "<td>" + esc(s.mode) + "</td>"
      + '<td class="mono">' + esc(s.vip || "-") + "</td>"
      + "<td>" + size(s.rx_bytes) + "</td>"
      + "<td>" + size(s.tx_bytes) + "</td>"
      + "<td>" + s.dropped + "</td>"
      + "<td>" + s.rtt_ms + " ms</td>"
      + "<td>" + dur(s.age) + "</td>"
      + "<td>" + (s.idle < 5 ? "刚刚" : s.idle + "s") + "</td>"
      + "</tr>";
  }).join("");
}

/* ---------------------------------------------------------------- 审计 */

var AUDIT_NAMES = {
  generate: "发卡", login: "激活登录", logout: "退出", join: "进隧道",
  ban: "封禁", unban: "解封", unbind: "解绑", reset: "重置", delete: "删除",
  extend: "续期"
};

function loadAudit(){
  api("/admin/audit?limit=300").then(function(r){
    var list = r.audit || [];
    $("auditCount").textContent = "最近 " + list.length + " 条";
    if(!list.length){
      $("auditBody").innerHTML = '<tr><td colspan="6" class="empty">暂无记录</td></tr>';
      return;
    }
    $("auditBody").innerHTML = list.map(function(a){
      return "<tr>"
        + "<td>" + ts(a.ts) + "</td>"
        + "<td>" + esc(AUDIT_NAMES[a.action] || a.action) + "</td>"
        + '<td class="mono">' + esc(a.card_key || "-") + "</td>"
        + '<td class="mono">' + esc((a.device || "-").slice(0, 14)) + "</td>"
        + '<td class="mono">' + esc(a.ip || "-") + "</td>"
        + "<td>" + esc(a.detail || "") + "</td>"
        + "</tr>";
    }).join("");
  }).catch(function(e){
    $("auditBody").innerHTML = '<tr><td colspan="6" class="empty">' + esc(e.message) + "</td></tr>";
  });
}

/* ---------------------------------------------------------------- 导航 */

document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
    document.querySelectorAll(".panel").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    $("panel-" + t.dataset.panel).classList.add("active");
    if(t.dataset.panel === "audit") loadAudit();
    if(t.dataset.panel === "sessions") loadStats();
  };
});

function refreshAll(){
  if(!KEY) return;
  loadStats();
  loadCards();
}

/* 首次加载：URL 里带 admin_key 就直接记住 */
(function init(){
  var m = location.search.match(/[?&]admin_key=([^&]+)/);
  if(m){
    KEY = decodeURIComponent(m[1]);
    localStorage.setItem("zf_admin_key", KEY);
  }
  $("adminKey").value = KEY;
  refreshAll();
  setInterval(function(){
    if(!KEY) return;
    loadStats();
    if($("panel-sessions").classList.contains("active")) return;
  }, 5000);
})();
</script>
</body>
</html>
