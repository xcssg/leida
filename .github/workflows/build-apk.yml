name: build-zuofang-apk

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "卡密 API 地址，例如 http://1.2.3.4:8090"
        required: true
        default: "http://1.2.3.4:8090"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 NDK 与 cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: 交叉编译 Rust 引擎
        working-directory: zuofang/app/rust
        run: |
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
          ls -lh ../android/app/src/main/jniLibs/arm64-v8a/

      - name: 拉取 Flutter 依赖
        working-directory: zuofang/app
        run: flutter pub get

      - name: 打包 release APK
        working-directory: zuofang/app
        run: |
          flutter build apk --release \
            --dart-define=ZF_API=${{ inputs.api_base }}

      - name: 重命名产物
        run: |
          mkdir -p out
          cp zuofang/app/build/app/outputs/flutter-apk/app-release.apk "out/zuofang-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zuofang-apk
          path: out/*.apk
          retention-days: 30
